name: "Sub workflow"
on:
  workflow_call:

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run"
        run: |
          echo "Hello, world!"
        with:
          my_secret: ${{ secrets.MY_SECRET }}

  test_less_permissions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Run"
        run: |
          echo "Hello, world!"
        with:
          my_secret: ${{ secrets.MY_SECRET }}